version: 2
updates:
  # ─────────────────────────────────────────────
  # JS/TS (pnpm workspace)
  # ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    # pnpm workspace はルートの pnpm-lock.yaml で全 apps/* を管理するため
    # ルートのみ指定する。apps/* を併記すると同一更新のPRが重複し、
    # サブディレクトリ側はルートのロックファイルを更新できず
    # ERR_PNPM_OUTDATED_LOCKFILE で CI が落ちる（例: PR #314 と #315）。
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "deps:npm"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    ignore:
      # typescript-eslint が TypeScript 7 (native) 未対応のため
      # (peer: >=4.8.4 <6.1.0)。対応され次第このエントリを削除する。
      # 経緯: PR #313 で TS 7.0.2 バンプにより eslint がクラッシュ。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # 1) security updates: combine into single PR
      security:
        applies-to: "security-updates"
        patterns:
          - "*"

      # 2) version updates: group minor/patch by dependency type
      prod-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types: ["minor", "patch"]
        patterns:
          - "*"

      dev-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types: ["minor", "patch"]
        patterns:
          - "*"

      # 3) dev major tooling: group safe-to-batch updates
      dev-major-tooling:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types: ["major"]
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"
          - "typescript"
          - "@types/*"
          - "vitest*"
          - "@vitest/*"

  # ─────────────────────────────────────────────
  # Rust/Tauri
  # ─────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directories:
      - "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "deps:cargo"
    commit-message:
      prefix: "deps(cargo)"
      include: "scope"
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      major-tooling:
        applies-to: "version-updates"
        update-types: ["major"]
        patterns:
          - "tauri*"
          - "serde*"
          - "tokio*"

  # ─────────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "deps:actions"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
        patterns:
          - "*"
