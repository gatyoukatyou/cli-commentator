name: companion-lab

on:
  pull_request:
    paths:
      - "apps/companion-lab/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/companion-lab.yml"
  push:
    branches:
      - main
    paths:
      - "apps/companion-lab/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/companion-lab.yml"

jobs:
  companion-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck companion lab
        run: pnpm typecheck:companion-lab

      - name: Test companion lab
        run: pnpm test:companion-lab
