name: release-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater key configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/verify-updater-config.mjs --require-private-key

      - name: Detect Apple signing/notarization mode
        id: apple_signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-apple-signing-secrets.mjs --mode detect --write-github-output

      - name: Configure macOS keychain for code signing
        if: ${{ steps.apple_signing.outputs.enabled == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/apple-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Detect code signing identity
        if: ${{ steps.apple_signing.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/codesign-identities.txt"

          IDENTITY="$(awk -F '"' '/Developer ID Application/ { print $2; exit }' "$RUNNER_TEMP/codesign-identities.txt")"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(awk -F '"' '/"/ { print $2; exit }' "$RUNNER_TEMP/codesign-identities.txt")"
          fi

          if [ -z "$IDENTITY" ]; then
            echo "::error::No usable code signing identity found in imported certificate."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "::notice::Detected code signing identity for build."

      - name: Log notarization configuration
        if: ${{ steps.apple_signing.outputs.enabled == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APPLE_ID_DOMAIN="${APPLE_ID#*@}"
          echo "::notice::Notarization credentials configured (team=$APPLE_TEAM_ID, account-domain=$APPLE_ID_DOMAIN)."

      - name: Log unsigned fallback mode
        if: ${{ steps.apple_signing.outputs.enabled != 'true' }}
        run: |
          set -euo pipefail
          echo "::warning::Building unsigned artifacts for internal testing (Developer ID / notarization not configured)."
          echo "::warning::Missing secrets: ${{ steps.apple_signing.outputs.missing }}"

      - name: Enforce signed mode for non-smoke tags
        if: ${{ steps.apple_signing.outputs.enabled != 'true' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.0.0-smoke.') }}
        run: |
          set -euo pipefail
          echo "::error::Apple signing/notarization secrets are required for non-smoke release tags: ${{ github.ref_name }}"
          echo "::error::Either configure Apple secrets or use a smoke tag (v0.0.0-smoke.*) for unsigned internal validation."
          exit 1

      - name: Web lint
        run: pnpm -C apps/web lint

      - name: Web build
        run: pnpm -C apps/web build

      - name: Server tests
        env:
          CLI_COMMENTATOR_FORCE_NO_PTY: "1"
        run: pnpm -C apps/server test

      - name: Server typecheck
        run: pnpm -C apps/server exec tsc --noEmit

      - name: Prepare desktop sidecar artifacts
        run: pnpm prepare:desktop-sidecar

      - name: Verify sidecar artifacts
        run: |
          set -euo pipefail
          target_triple="$(rustc --print host-tuple 2>/dev/null || rustc -Vv | awk '/^host:/ {print $2}')"
          node_binary="apps/desktop/src-tauri/binaries/node-${target_triple}"
          if [[ "${target_triple}" == *windows* ]]; then
            node_binary="${node_binary}.exe"
          fi

          test -f "${node_binary}"
          test -f apps/desktop/src-tauri/resources/server/dist/index.js
          test -f apps/desktop/src-tauri/resources/sidecar-manifest.json

          echo "Sidecar artifacts OK:"
          echo "- ${node_binary}"
          echo "- apps/desktop/src-tauri/resources/server/dist/index.js"
          echo "- apps/desktop/src-tauri/resources/sidecar-manifest.json"

      - name: Detect release publish token mode
        id: release_token
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GH_RELEASE_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using GH_RELEASE_TOKEN for Draft Release creation."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_RELEASE_TOKEN is not set. Smoke tags will build artifacts without creating Draft Release."
          fi

      - name: Enforce release token for non-smoke tags
        if: ${{ steps.release_token.outputs.available != 'true' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.0.0-smoke.') }}
        run: |
          set -euo pipefail
          echo "::error::GH_RELEASE_TOKEN is required for non-smoke release tags: ${{ github.ref_name }}"
          echo "::error::Configure GH_RELEASE_TOKEN with contents:write and rerun."
          exit 1

      - name: Build and draft release (signed + notarized)
        if: ${{ steps.apple_signing.outputs.enabled == 'true' && steps.release_token.outputs.available == 'true' }}
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: CLI Commentator ${{ github.ref_name }}
          releaseBody: See the assets to download and install this version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and draft release (unsigned internal)
        if: ${{ steps.apple_signing.outputs.enabled != 'true' && startsWith(github.ref_name, 'v0.0.0-smoke.') && steps.release_token.outputs.available == 'true' }}
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: CLI Commentator ${{ github.ref_name }} (unsigned internal)
          releaseBody: Unsigned internal test build from ${{ github.ref_name }}. Apple Developer ID signing/notarization is not configured.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Resolve fallback target triple
        if: ${{ steps.release_token.outputs.available != 'true' && startsWith(github.ref_name, 'v0.0.0-smoke.') }}
        id: fallback_target
        run: |
          set -euo pipefail
          case "${{ matrix.args }}" in
            *aarch64-apple-darwin*)
              echo "triple=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
              ;;
            *x86_64-apple-darwin*)
              echo "triple=x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported matrix args: ${{ matrix.args }}"
              exit 1
              ;;
          esac

      - name: Build smoke artifacts without Draft Release (token fallback)
        if: ${{ steps.release_token.outputs.available != 'true' && startsWith(github.ref_name, 'v0.0.0-smoke.') }}
        run: |
          set -euo pipefail
          pnpm -C apps/desktop tauri:build -- ${{ matrix.args }}

          bundle_dir="apps/desktop/src-tauri/target/${{ steps.fallback_target.outputs.triple }}/release/bundle"
          test -d "${bundle_dir}"
          find "${bundle_dir}" -name "*.dmg" | grep -q .
          find "${bundle_dir}" -name "*.app.tar.gz" | grep -q .
          find "${bundle_dir}" -name "*.app.tar.gz.sig" | grep -q .

      - name: Upload smoke artifacts (token fallback)
        if: ${{ steps.release_token.outputs.available != 'true' && startsWith(github.ref_name, 'v0.0.0-smoke.') }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-bundle-${{ steps.fallback_target.outputs.triple }}
          path: apps/desktop/src-tauri/target/${{ steps.fallback_target.outputs.triple }}/release/bundle
