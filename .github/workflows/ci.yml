name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  failure_regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run failure regression suite
        run: |
          set -euo pipefail
          mkdir -p artifacts/failure-regression
          pnpm -C apps/server exec vitest run \
            src/tests/windows-fallback-integration.test.ts \
            src/tests/pty.unavailable.test.ts \
            src/tests/file.fallback.test.ts \
            src/tests/comment.errors.test.ts \
            --reporter=default \
            --reporter=json \
            --outputFile ../../artifacts/failure-regression/vitest-results.json \
            2>&1 | tee artifacts/failure-regression/console.log

      - name: Upload failure regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-regression-logs
          path: artifacts/failure-regression

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Server tests
        run: pnpm -C apps/server test

      - name: Server typecheck
        run: pnpm -C apps/server exec tsc --noEmit

      - name: Web build
        run: pnpm -C apps/web build

      - name: Web lint
        run: pnpm -C apps/web lint

  desktop_check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Desktop cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Desktop cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  test_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Server tests
        run: pnpm -C apps/server test

      - name: Server typecheck
        run: pnpm -C apps/server exec tsc --noEmit

      - name: Web build
        run: pnpm -C apps/web build

      - name: Web lint
        run: pnpm -C apps/web lint
