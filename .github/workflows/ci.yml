name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  failure_regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run failure regression suite
        run: |
          set -euo pipefail
          mkdir -p artifacts/failure-regression
          pnpm -C apps/server exec vitest run \
            src/tests/windows-fallback-integration.test.ts \
            src/tests/pty.unavailable.test.ts \
            src/tests/file.fallback.test.ts \
            src/tests/comment.errors.test.ts \
            --reporter=default \
            --reporter=json \
            --outputFile ../../artifacts/failure-regression/vitest-results.json \
            2>&1 | tee artifacts/failure-regression/console.log

      - name: Upload failure regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-regression-logs
          path: artifacts/failure-regression

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Server tests
        run: pnpm -C apps/server test

      - name: Server typecheck
        run: pnpm -C apps/server exec tsc --noEmit

      - name: Web build
        run: pnpm -C apps/web build

      - name: Web lint
        run: pnpm -C apps/web lint

  desktop_check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare desktop sidecar artifacts
        shell: pwsh
        run: |
          $hostTriple = (rustc -vV | Select-String '^host:' | ForEach-Object { $_.ToString().Split(':')[1].Trim() })
          $nodeBinaryName = if ($hostTriple -like '*windows*') { "node-$hostTriple.exe" } else { "node-$hostTriple" }
          $nodeDest = "apps/desktop/src-tauri/binaries/$nodeBinaryName"
          New-Item -ItemType Directory -Force -Path (Split-Path $nodeDest) | Out-Null
          Copy-Item -Force (Get-Command node).Source $nodeDest

          $serverDistDir = "apps/desktop/src-tauri/resources/server/dist"
          New-Item -ItemType Directory -Force -Path $serverDistDir | Out-Null
          $serverEntry = Join-Path $serverDistDir "index.js"
          if (-not (Test-Path $serverEntry)) {
            Set-Content -Path $serverEntry -NoNewline -Value "console.log('ci placeholder sidecar server');"
          }

          $manifestPath = "apps/desktop/src-tauri/resources/sidecar-manifest.json"
          $manifest = @{
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            targetTriple = $hostTriple
            nodeVersion = (node --version)
            serverVersion = "0.0.0-ci"
            nodeBinary = "binaries/$nodeBinaryName"
            serverRoot = "resources/server"
            serverEntry = "resources/server/dist/index.js"
          } | ConvertTo-Json
          Set-Content -Path $manifestPath -Value $manifest

          Write-Host "Prepared sidecar binary: $nodeDest"
          Write-Host "Prepared sidecar resources: apps/desktop/src-tauri/resources/server"

      - name: Desktop cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Desktop cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  desktop_distribution_smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web build
        run: pnpm -C apps/web build

      - name: Prepare desktop sidecar artifacts
        run: pnpm prepare:desktop-sidecar

      - name: Verify sidecar artifacts
        run: |
          set -euo pipefail
          target_triple="$(rustc --print host-tuple 2>/dev/null || rustc -Vv | awk '/^host:/ {print $2}')"
          node_binary="apps/desktop/src-tauri/binaries/node-${target_triple}"
          if [[ "${target_triple}" == *windows* ]]; then
            node_binary="${node_binary}.exe"
          fi

          test -f "${node_binary}"
          test -f apps/desktop/src-tauri/resources/server/dist/index.js
          test -f apps/desktop/src-tauri/resources/sidecar-manifest.json

          echo "Sidecar artifacts OK:"
          echo "- ${node_binary}"
          echo "- apps/desktop/src-tauri/resources/server/dist/index.js"
          echo "- apps/desktop/src-tauri/resources/sidecar-manifest.json"

      - name: Desktop tauri build
        run: |
          pnpm -C apps/desktop tauri:build \
            --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify desktop build outputs
        run: |
          set -euo pipefail
          bundle_dir="apps/desktop/src-tauri/target/release/bundle"
          test -d "${bundle_dir}"
          if ! find "${bundle_dir}" -name "*.app" | grep -q .; then
            echo "Desktop app bundle artifacts were not produced."
            exit 1
          fi
          find "${bundle_dir}" -name "*.app"

  test_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Server tests
        run: pnpm -C apps/server test

      - name: Server typecheck
        run: pnpm -C apps/server exec tsc --noEmit

      - name: Web build
        run: pnpm -C apps/web build

      - name: Web lint
        run: pnpm -C apps/web lint
